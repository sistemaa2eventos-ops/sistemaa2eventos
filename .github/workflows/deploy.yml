name: Deploy Automático A2 Eventos

on:
  push:
    branches:
      - master # a VPS publica sempre origin/master (um push em outra branch não deve disparar)
  workflow_dispatch: # Permite disparar o deploy manualmente pela interface do GitHub

# Um deploy por vez: dois pushes seguidos rodavam o deploy.sh em paralelo na VPS
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  test-backend:
    name: Rodar Suíte de Testes (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/api-nodejs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/api-nodejs/package-lock.json

      # npm ci: instala exatamente o que está no package-lock (o mesmo que vai para a imagem)
      - name: Instalar dependências
        run: npm ci

      - name: Rodar Testes
        run: npm test

  # Um erro de sintaxe no nginx do gateway derruba TODOS os domínios (o entrypoint roda nginx -t e o
  # container reinicia em loop). Este job valida as configurações antes de qualquer coisa chegar à VPS.
  validate-nginx:
    name: Validar configurações do nginx
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Gateway (imagem real, certificado provisório)
        run: |
          docker build -q -t nzt-gateway-teste ./gateway
          docker run --rm --entrypoint sh nzt-gateway-teste -c '
            mkdir -p /etc/nginx/certs &&
            openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=teste" \
              -keyout /etc/nginx/certs/origin.key -out /etc/nginx/certs/origin.pem 2>/dev/null &&
            nginx -t'

      - name: Front-ends (painel, portal do produtor, portal da empresa)
        run: |
          for app in web-admin portal-produtor portal-empresa; do
            echo "== $app"
            docker run --rm --add-host api:127.0.0.1 \
              -v "$PWD/frontend/$app/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
              nginx:alpine nginx -t
          done

  deploy:
    name: Deploy para VPS Hostinger
    runs-on: ubuntu-latest
    needs: [test-backend, validate-nginx]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Executar Deploy via SSH no VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          # Mude o diretório abaixo (cd) se o projeto estiver em outro local no VPS
          script: |
            echo "Iniciando processo de deploy..."
            cd /root/Projeto_A2_Eventos
            # Limpa qualquer modificação manual no servidor para não travar o script
            git fetch origin
            git reset --hard origin/master
            git clean -fd
            # Ignora mudanças de permissão (chmod) para não sujar a working tree
            git config core.fileMode false
            
            # Create swapfile to prevent OOM during docker build (dlib needs RAM)
            if [ $(free | awk '/^Swap:/ {print $2}') -eq 0 ]; then
                echo "Creating 2GB swap file..."
                fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
                chmod 600 /swapfile
                mkswap /swapfile
                swapon /swapfile || true
            fi
            
            # Segredo próprio do portal da empresa: grava no .env da VPS só se ainda não existir
            # (não sobrescreve um valor já configurado no servidor)
            if ! grep -q "^PORTAL_EMPRESA_SEGREDO=" .env; then
                [ -n "$(tail -c1 .env)" ] && echo "" >> .env
                echo "PORTAL_EMPRESA_SEGREDO=${{ secrets.PORTAL_EMPRESA_SEGREDO }}" >> .env
                echo "PORTAL_EMPRESA_SEGREDO gravado no .env"
            fi

            # Garante que o script tem permissão de execução
            chmod +x deploy.sh
            
            # Executa o deploy rápido respondendo 's' caso haja mudanças locais detectadas pelo script
            echo 's' | ./deploy.sh quick
            
            echo "Deploy disparado pelo GitHub Actions finalizado."
