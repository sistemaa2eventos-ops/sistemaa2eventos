name: Deploy Automático A2 Eventos

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: # Permite disparar o deploy manualmente pela interface do GitHub

jobs:
  test-backend:
    name: Rodar Suíte de Testes (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/api-nodejs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          
      - name: Instalar dependências
        run: npm install
        
      - name: Rodar Testes
        run: npm test

  deploy:
    name: Deploy para VPS Hostinger
    runs-on: ubuntu-latest
    needs: test-backend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Executar Deploy via SSH no VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          # Mude o diretório abaixo (cd) se o projeto estiver em outro local no VPS
          script: |
            echo "Iniciando processo de deploy..."
            cd /root/Projeto_A2_Eventos
            
            # Garante que o script tem permissão de execução
            chmod +x deploy.sh
            
            # Executa o deploy rápido
            ./deploy.sh quick
            
            echo "Deploy disparado pelo GitHub Actions finalizado."
