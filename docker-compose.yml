version: '3.8'

services:
  # postgres_edge (banco local "Edge") removido em 2026-10-10: estava vazio e o backend grava tudo
  # direto no Supabase. Para voltar a usá-lo: recriar o serviço e definir EDGE_DB_ENABLED=true.

  redis:
    image: redis:7-alpine
    container_name: a2_eventos_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # Redis sem senha: só acessível no próprio servidor (Docker ignora o UFW)
    volumes:
      - redis_data:/data
    networks:
      - a2_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  api:
    build:
      context: ./backend/api-nodejs
    container_name: a2_eventos_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001" # acesso externo só pelo Nginx (gateway)
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS=true
    env_file:
      - ./backend/api-nodejs/.env
    networks:
      - a2_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  api_intelbras:
    build:
      context: ./backend/api-nodejs
    container_name: a2_eventos_api_intelbras
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3002" # leitores chegam via Nginx (leitores.nzt.app.br)
    command: npm run start:intelbras
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - PORT=3002
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS=true
    env_file:
      - ./backend/api-nodejs/.env
    networks:
      - a2_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/intelbras/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  gateway:
    build:
      context: ./gateway
    container_name: a2_eventos_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificado de origem Cloudflare (origin.pem + origin.key) — fora do git
      - ./gateway/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - a2_net

  frontend:
    build:
      context: ./frontend/web-admin
    container_name: a2_eventos_admin_web
    restart: unless-stopped
    # Porta 80 do host removida - servido via gateway
    depends_on:
      api:
        condition: service_started
    environment:
      - TZ=America/Sao_Paulo
      # Gravados em /config.js ao iniciar (docker-entrypoint.sh); vêm do .env da raiz
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    networks:
      - a2_net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

