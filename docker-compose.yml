# Sem limite, o log do Docker cresce para sempre e pode encher o disco da VPS
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # postgres_edge (banco local "Edge") removido em 2026-10-10: estava vazio e o backend grava tudo
  # direto no Supabase. Para voltar a usá-lo: recriar o serviço e definir EDGE_DB_ENABLED=true.

  redis:
    logging: *logging
    image: redis:7-alpine
    container_name: a2_eventos_redis
    restart: unless-stopped
    # Fila de acessos que falharam no Supabase (stream) precisa sobreviver a reinício e nunca
    # ser descartada: AOF a cada 1 s e "noeviction" (sem memória, recusa escrita em vez de apagar)
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379" # Redis sem senha: só acessível no próprio servidor (Docker ignora o UFW)
    volumes:
      - redis_data:/data
    networks:
      - a2_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  api:
    logging: *logging
    build:
      context: ./backend/api-nodejs
    container_name: a2_eventos_api
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:3001:3001" # acesso externo só pelo Nginx (gateway)
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS=true
      # heap do Node abaixo do limite do container: o V8 libera memória antes de o kernel matar o processo
      - NODE_OPTIONS=--max-old-space-size=768
    env_file:
      - ./backend/api-nodejs/.env
    networks:
      - a2_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  api_intelbras:
    logging: *logging
    build:
      context: ./backend/api-nodejs
    container_name: a2_eventos_api_intelbras
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3002" # leitores chegam via Nginx (leitores.nzt.app.br)
    # node direto (sem npm) para receber o SIGTERM e terminar os acessos em andamento
    command: ["node", "src/intelbras-app.js"]
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - PORT=3002
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS=true
      - NODE_OPTIONS=--max-old-space-size=384
    env_file:
      - ./backend/api-nodejs/.env
    networks:
      - a2_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/api/intelbras/ping', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  gateway:
    logging: *logging
    build:
      context: ./gateway
    container_name: a2_eventos_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificado de origem Cloudflare (origin.pem + origin.key) — fora do git
      - ./gateway/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
      cadastro:
        condition: service_started
    networks:
      - a2_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    logging: *logging
    build:
      context: ./frontend/web-admin
    container_name: a2_eventos_admin_web
    restart: unless-stopped
    # Porta 80 do host removida - servido via gateway
    depends_on:
      api:
        condition: service_started
    environment:
      - TZ=America/Sao_Paulo
      # Gravados em /config.js ao iniciar (docker-entrypoint.sh); vêm do .env da raiz
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    networks:
      - a2_net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Portal público de cadastro (cadastro.nzt.app.br): empresas cadastram a equipe pelo link de convite
  cadastro:
    logging: *logging
    build:
      context: ./frontend/public-web
    container_name: a2_eventos_portal
    restart: unless-stopped
    # Sem porta no host - servido via gateway
    depends_on:
      api:
        condition: service_started
    environment:
      - TZ=America/Sao_Paulo
      - NODE_ENV=production
    networks:
      - a2_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

# Câmeras com IA rodam no PC local do evento, não na VPS (as câmeras ficam na rede local do evento):
# motor backend/microservice-face-python + agente backend/agent-local, ligados por scripts/ligar-ia-facial.bat.

networks:
  a2_net:
    driver: bridge

volumes:
  redis_data:
