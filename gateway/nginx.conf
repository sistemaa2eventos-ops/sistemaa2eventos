worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 🔒 Security Headers - Protege contra ataques comuns
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: fontes do Google (painel), blob: (prévias de foto/documento, câmera) e, só no portal
    # (Next.js), scripts inline — sem eles o portal não hidrata.
    map $host $csp_script {
        cadastro.nzt.app.br "script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'";
        default             "script-src 'self' 'wasm-unsafe-eval'";
    }
    # Se o navegador estiver preso no bundle antigo (sem X-App-Version), limpa o cache HTTP local
    map $http_x_app_version $clear_stale_http_cache {
        ""      '"cache"';
        default "";
    }
    add_header Content-Security-Policy "default-src 'self'; $csp_script; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https: wss: blob: data:; frame-src 'self' blob: https:; object-src 'self' blob:; worker-src 'self' blob:; base-uri 'self'; form-action 'self'" always;
    server_tokens off;

    # Otimizações de Conexão e Segurança adicionais
    client_max_body_size 10M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;

    # Compressão Gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/javascript text/javascript application/json application/manifest+json
               text/css text/plain text/xml application/xml image/svg+xml;

    # Resolver interno do Docker para resolução dinâmica de nomes.
    # Os proxy_pass usam variável DE PROPÓSITO (não "upstream"): o deploy recria a API sem
    # reiniciar o gateway e o IP do container muda; com upstream fixo o nginx ficaria no IP
    # antigo (502) e nem subiria se um serviço estivesse fora no boot.
    resolver 127.0.0.11 valid=30s;

    # Cabeçalho Connection: "upgrade" só para WebSocket; nas requisições comuns não força upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Saúde do próprio gateway (healthcheck do Docker), só dentro do container
    server {
        listen 127.0.0.1:8081;
        location = /nginx-health { access_log off; return 200 "ok"; }
    }

    # IP real do usuário atrás do Cloudflare (sem isto, o backend vê o IP do Cloudflare
    # e o limite de requisições/login fica compartilhado entre todos os usuários).
    # Faixas oficiais: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # 🔐 HTTPS da origem (Cloudflare SSL "Full"/"Full (strict)")
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 1. 🖼️ PAINEL ADMINISTRATIVO (Frontend)
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name painel.nzt.app.br;

        # Vídeo ao vivo das câmeras (MJPEG contínuo): sem buffer (espectador lento perde quadros em vez de
        # acumular atraso), sem gzip e sem corte por tempo enquanto houver quadros
        location ~ ^/api/cameras/[^/]+/stream$ {
            set $upstream_api api;
            proxy_pass http://$upstream_api:3001;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s; # câmera parada alguns segundos não derruba o vídeo
            send_timeout 60s;
            gzip off;
        }

        location = /api/eventos {
            add_header Clear-Site-Data $clear_stale_http_cache always;
            set $upstream_api api;
            proxy_pass http://$upstream_api:3001;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API e tempo real direto para o backend (sem passar pelo nginx do container do painel)
        location /api/ {
            set $upstream_api api;
            proxy_pass http://$upstream_api:3001;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /socket.io/ {
            set $upstream_api api;
            proxy_pass http://$upstream_api:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location / {
            set $upstream_frontend frontend;
            proxy_pass http://$upstream_frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 1.2 📝 PORTAL PÚBLICO DE CADASTRO (empresas cadastram a equipe pelo link de convite)
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name cadastro.nzt.app.br;

        # O portal chama /api/... no próprio domínio (sem CORS)
        location /api/ {
            set $upstream_api api;
            proxy_pass http://$upstream_api:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $upstream_cadastro cadastro;
            proxy_pass http://$upstream_cadastro:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 1.5 📟 LEITORES FACIAIS (HTTP puro)
    server {
        listen 80;
        server_name leitores.nzt.app.br;
        client_max_body_size 20m; # leitores enviam foto do evento (o serviço aceita até 20 MB)

        location /api/intelbras/ {
            set $upstream_intelbras api_intelbras;
            proxy_pass http://$upstream_intelbras:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 15s;
        }

        location / {
            return 404;
        }
    }

    # 2. ⚡ API BACKEND (Node.js)
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name api.nzt.app.br;

        # NOVO: Isolamento do Worker de Webhooks (Hardware)
        location /api/intelbras/ {
            client_max_body_size 20m;
            set $upstream_intelbras api_intelbras;
            proxy_pass http://$upstream_intelbras:3002;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Vídeo ao vivo das câmeras (<img>, sem CORS): sem buffer e sem gzip
        location ~ ^/api/cameras/[^/]+/stream$ {
            set $upstream_api api;
            proxy_pass http://$upstream_api:3001;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s; # câmera parada alguns segundos não derruba o vídeo
            send_timeout 60s;
            gzip off;
        }

        location / {
            # --- MARTELO CORS SOBERANO (v12.4) ---
            set $cors_origin "https://painel.nzt.app.br";
            
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Event-ID,x-evento-id,X-App-Version,x-app-version' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Event-ID,x-evento-id,X-App-Version,x-app-version' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            set $upstream_api api;
            proxy_pass http://$upstream_api:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
