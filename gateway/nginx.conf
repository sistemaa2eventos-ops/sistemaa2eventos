worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 🔒 Security Headers - Protege contra ataques comuns
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' wss: https:" always;
    server_tokens off;

    # Otimizações de Conexão e Segurança adicionais
    client_max_body_size 10M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;
    # keepalive_timeout 30s; removed because it duplicates line 11

    # Compressão Gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/javascript application/json text/css text/plain text/xml;

    # Resolver interno do Docker para resolução dinâmica de nomes
    resolver 127.0.0.11 valid=30s;

    # IP real do usuário atrás do Cloudflare (sem isto, o backend vê o IP do Cloudflare
    # e o limite de requisições/login fica compartilhado entre todos os usuários).
    # Faixas oficiais: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # 🔐 HTTPS da origem (Cloudflare SSL "Full"/"Full (strict)")
    # Certificado de origem Cloudflare (*.nzt.app.br), montado por volume em /etc/nginx/certs
    # (gateway/certs/origin.pem + origin.key — NÃO versionar). Sem ele, o entrypoint gera um
    # autoassinado provisório para o Nginx subir (aceito só no modo "Full", não no "strict").
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 1. 🖼️ PAINEL ADMINISTRATIVO (Frontend)
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name painel.nzt.app.br;

        location / {
            set $upstream_frontend frontend;
            proxy_pass http://$upstream_frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 1.5 📟 LEITORES FACIAIS (HTTP puro)
    # Os terminais Intelbras não seguem redirecionamento para HTTPS. Este subdomínio deve
    # ficar "somente DNS" (nuvem cinza) no Cloudflare e expõe apenas as rotas dos leitores.
    # Configure os leitores com HARDWARE_CALLBACK_HOST=leitores.nzt.app.br e porta 80.
    server {
        listen 80;
        server_name leitores.nzt.app.br;

        location /api/intelbras/ {
            set $upstream_intelbras api_intelbras;
            proxy_pass http://$upstream_intelbras:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 15s;
        }

        location / {
            return 404;
        }
    }

    # 2. ⚡ API BACKEND (Node.js)
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name api.nzt.app.br;

        # NOVO: Isolamento do Worker de Webhooks (Hardware)
        location /api/intelbras/ {
            set $upstream_intelbras api_intelbras;
            proxy_pass http://$upstream_intelbras:3002;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            # --- MARTELO CORS SOBERANO (v12.4) ---
            set $cors_origin "https://painel.nzt.app.br";
            
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Event-ID,x-evento-id' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Event-ID,x-evento-id' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            set $upstream_api api;
            proxy_pass http://$upstream_api:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
