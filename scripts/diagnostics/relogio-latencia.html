<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Relógio de latência (NZT)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  #hora { font-size: min(18vw, 260px); font-weight: bold; letter-spacing: 2px; }
  #info { font-size: 28px; color: #7CFC00; }
  #contador { font-size: 22px; color: #ffd24d; }
  button { font-size: 20px; padding: 8px 18px; cursor: pointer; }
</style>
</head>
<body>
  <div id="hora">--:--:--.---</div>
  <div id="info">Coloque esta tela em tela cheia e aponte a câmera para ela.</div>
  <div id="contador">Ciclos: 0</div>
  <button id="btn">Tela cheia</button>
<script>
  // Mostra a hora real com milissegundos. Comparando a hora desta tela com a hora que aparece
  // no vídeo (câmera ou Central), a diferença é o atraso de ponta a ponta naquele caminho.
  const hora = document.getElementById('hora');
  const contador = document.getElementById('contador');
  let ciclos = 0;
  function pad(n, t = 2) { return String(n).padStart(t, '0'); }
  function tick() {
    const d = new Date();
    hora.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`;
    requestAnimationFrame(tick);
  }
  setInterval(() => { ciclos++; contador.textContent = `Ciclos: ${ciclos}`; }, 1000);
  document.getElementById('btn').onclick = () => document.documentElement.requestFullscreen?.();
  tick();
</script>
</body>
</html>
